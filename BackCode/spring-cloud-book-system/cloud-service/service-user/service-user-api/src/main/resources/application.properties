#持久化数据库
service.user.update.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
service.user.update.datasource.jdbcUrl=jdbc:sqlserver://127.0.0.1:9999;databaseName=CloudBookSystem;encrypt=true;trustServerCertificate=true
service.user.update.datasource.username=sa
service.user.update.datasource.password=Zemic#10245275
service.user.update.datasource.initialize=false

#查询数据库
service.user.query.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
service.user.query.datasource.jdbcUrl=jdbc:sqlserver://127.0.0.1:9999;databaseName=CloudBookSystem
service.user.query.datasource.username=sa
service.user.query.datasource.password=Zemic#10245275
service.user.query.datasource.initialize=false

#jpa相关配置
# 打印 SQL 日志
spring.jpa.properties.hibernate.show-sql=true
# 禁止自动建表、改表、删表（生产必开 none）
spring.jpa.properties.hibernate.ddl-auto=none
# 指定 SQLServer 方言 → 让 Hibernate 适配 sqlserver 语法
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
# 实体类字段名 = 数据库字段名，不自动驼峰转下划线
spring.jpa.properties.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
# JPA 二级缓存配置
spring.jpa.properties.javax.persistence.sharedCache.mode=ALL